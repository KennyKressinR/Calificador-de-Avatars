
name: Compilar APK de Calificador de Avatars

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Crear el proyecto Android
        run: |
          mkdir www && cp index.html www/index.html
          echo '{"appId":"app.calificador.avatars","appName":"Calificador de Avatars","webDir":"www"}' > capacitor.config.json
          npm init -y > /dev/null
          npm i @capacitor/core@8 @capacitor/android@8 @capacitor/filesystem@8
          npm i -D @capacitor/cli@8
          npx cap add android

      - name: Guardar archivos en el telefono (la copia de seguridad)
        run: |
          cat > www/apk-shim.js <<'EOF'
          // Android WebView ignora las descargas por enlace (blob). Este parche las intercepta
          // y las guarda en Documentos/Calificador de Avatars. Solo actua dentro del APK.
          (function () {
            var C = window.Capacitor;
            if (!C || !C.isNativePlatform || !C.isNativePlatform()) return;
            var FS = (C.Plugins && C.Plugins.Filesystem) || (C.registerPlugin && C.registerPlugin('Filesystem'));
            if (!FS) return;
            var CARPETA = 'Calificador de Avatars';
            function msg(t) { try { if (typeof aviso === 'function') aviso(t); } catch (e) {} }
            document.addEventListener('click', function (e) {
              var a = e.target && e.target.closest ? e.target.closest('a[download]') : null;
              if (!a || String(a.href).indexOf('blob:') !== 0) return;
              e.preventDefault(); e.stopPropagation();
              var name = a.getAttribute('download') || 'archivo';
              fetch(a.href).then(function (r) { return r.blob(); }).then(function (b) {
                return new Promise(function (ok, no) {
                  var fr = new FileReader();
                  fr.onload = function () { ok(String(fr.result).split(',')[1] || ''); };
                  fr.onerror = no; fr.readAsDataURL(b);
                });
              }).then(function (b64) {
                return Promise.resolve(FS.requestPermissions ? FS.requestPermissions().catch(function () {}) : null).then(function () {
                  return FS.writeFile({ path: CARPETA + '/' + name, data: b64, directory: 'DOCUMENTS', recursive: true });
                });
              }).then(function () { msg('✅ Guardado en Documentos/' + CARPETA + '/' + name); },
                      function (err) { console.error(err); msg('No se pudo guardar el archivo'); });
            }, true);
          })();
          EOF
          sed -i 's#</head>#<script src="apk-shim.js"></script></head>#' www/index.html
          grep -c apk-shim www/index.html

      - name: Icono personalizado
        continue-on-error: true
        run: |
          cat > iconos.py <<'EOF'
          # Genera todos los iconos de Android (adaptable + clasico + redondo) a partir de icon.png
          import os, glob
          from PIL import Image, ImageDraw

          SRC = 'icon.png'
          RES = 'android/app/src/main/res'

          img = Image.open(SRC).convert('RGB')
          w, h = img.size
          s = min(w, h)
          img = img.crop(((w - s) // 2, (h - s) // 2, (w - s) // 2 + s, (h - s) // 2 + s)).resize((1024, 1024), Image.LANCZOS)
          bg = img.getpixel((3, 3))
          bg_hex = '#%02X%02X%02X' % bg

          LEGACY = {'mdpi': 48, 'hdpi': 72, 'xhdpi': 96, 'xxhdpi': 144, 'xxxhdpi': 192}
          FOREG = {'mdpi': 108, 'hdpi': 162, 'xhdpi': 216, 'xxhdpi': 324, 'xxxhdpi': 432}

          def mask(size, kind):
              big = size * 4
              m = Image.new('L', (big, big), 0)
              d = ImageDraw.Draw(m)
              if kind == 'round':
                  d.ellipse((0, 0, big - 1, big - 1), fill=255)
              else:
                  d.rounded_rectangle((0, 0, big - 1, big - 1), radius=int(big * 0.2), fill=255)
              return m.resize((size, size), Image.LANCZOS)

          for d in LEGACY:
              folder = os.path.join(RES, 'mipmap-' + d)
              os.makedirs(folder, exist_ok=True)
              for old in glob.glob(os.path.join(folder, 'ic_launcher*')):
                  os.remove(old)
              n, f = LEGACY[d], FOREG[d]
              for name, kind in (('ic_launcher.png', 'square'), ('ic_launcher_round.png', 'round')):
                  out = Image.new('RGBA', (n, n), (0, 0, 0, 0))
                  out.paste(img.resize((n, n), Image.LANCZOS).convert('RGBA'), (0, 0), mask(n, kind))
                  out.save(os.path.join(folder, name))
              # capa frontal del icono adaptable: el dibujo ocupa ~70% del lienzo para que el sistema no lo recorte
              fg = Image.new('RGBA', (f, f), (0, 0, 0, 0))
              k = int(round(f * 0.70))
              fg.paste(img.resize((k, k), Image.LANCZOS).convert('RGBA'), ((f - k) // 2, (f - k) // 2))
              fg.save(os.path.join(folder, 'ic_launcher_foreground.png'))

          adaptive = '''<?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/app_icon_bg"/>
              <foreground android:drawable="@mipmap/ic_launcher_foreground"/>
          </adaptive-icon>
          '''
          os.makedirs(os.path.join(RES, 'mipmap-anydpi-v26'), exist_ok=True)
          for name in ('ic_launcher.xml', 'ic_launcher_round.xml'):
              open(os.path.join(RES, 'mipmap-anydpi-v26', name), 'w').write(adaptive)
          os.makedirs(os.path.join(RES, 'values'), exist_ok=True)
          open(os.path.join(RES, 'values', 'app_icon.xml'), 'w').write(
              '<?xml version="1.0" encoding="utf-8"?>\n<resources><color name="app_icon_bg">%s</color></resources>\n' % bg_hex)
          print('Iconos listos. Color de fondo', bg_hex)
          EOF
          if [ -f icon.png ]; then
            pip3 install --quiet --user --break-system-packages pillow || pip3 install --quiet --user pillow
            python3 iconos.py
          else
            echo "No hay icon.png: se usa el icono por defecto"
          fi

      - name: Permisos
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.VIBRATE"/><uses-permission android:name="android.permission.WAKE_LOCK"/><uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28"/><uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/><application#' $M
          grep -c WAKE_LOCK $M
          npx cap sync android

