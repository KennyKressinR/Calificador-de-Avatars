      - name: Version de la app
        run: |
          V=$(tr -d ' \r\n' < version.txt 2>/dev/null || true)
          [ -z "$V" ] && V="1.0"
          G=android/app/build.gradle
          sed -i -E "s/versionCode *=? *[0-9]+/versionCode ${{ github.run_number }}/" $G
          sed -i -E "s/versionName *=? *\"[^\"]*\"/versionName \"$V\"/" $G
          grep -E "versionCode|versionName" $G
          echo "APP_VERSION=$V" >> $GITHUB_ENV

      - name: Compilar
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "../Calificador-Avatars-v${APP_VERSION}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Calificador-Avatars-APK
          path: Calificador-Avatars-v*.apk

      - name: Publicar en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="Calificador-Avatars-v${APP_VERSION}.apk"
          TAG="v${APP_VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" --title "Calificador de Avatars $TAG" --notes "APK listo para instalar"
          fi
